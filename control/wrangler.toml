name = "chimera-control"
main = "worker.js"
compatibility_date = "2025-10-01"

[triggers]
crons = ["*/5 * * * *"]

[vars]
MAX_AWAKE_MINUTES = "1440"
CLAUDE_DAILY_BUDGET = "2"

[observability]
enabled = true

[[rules]]
type = "Text"
globs = ["**/*.yaml", "**/*.html"]
fallthrough = false

[[durable_objects.bindings]]
name = "RECORDS"
class_name = "Records"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Records"]
