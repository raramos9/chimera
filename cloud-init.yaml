runcmd:
- |
  keys=/home/.chimera/ssh-host-keys
  if [ ! -d "$keys" ]; then
    install -d -m 700 "$keys"
    cp -p /etc/ssh/ssh_host_* "$keys"/
  fi
- install -d /run/chimera-idle /var/lib/chimera-awake && touch /var/lib/chimera-awake/awake.lock
- systemctl daemon-reload
- systemctl reload systemd-logind
- systemctl enable --now chimera-idle.timer chimera-backup.timer chimera-backup-on-shutdown.service
- systemctl enable --now chimera-firewall.service
- systemctl enable --now incus.socket incus-user.socket incus-startup.service chimera-memory.service
- |
  incus admin waitready --timeout 60
  if ! incus storage show default >/dev/null 2>&1; then
    disk=$(cat /run/chimera/machines-disk)
    rc=0; blkid -p "$disk" >/dev/null || rc=$?
    if [ "$rc" -eq 2 ]; then
      incus admin init --preseed <<EOF
  storage_pools:
  - name: default
    driver: btrfs
    config:
      source: $disk
  networks:
  - name: incusbr0
    type: bridge
    config:
      ipv4.address: 10.171.245.1/24
      dns.domain: ws
      ipv6.address: none
  profiles:
  - name: default
    devices:
      root: {path: /, pool: default, type: disk}
      eth0: {name: eth0, network: incusbr0, type: nic}
  EOF
    else
      echo "chimera: Incus has no storage but $disk isn't blank, leaving it alone (see 'incus admin recover')" >&2
    fi
  fi
  [ "$(incus network get incusbr0 dns.domain)" = ws ] || incus network set incusbr0 dns.domain=ws
  incus profile device get default awake source >/dev/null 2>&1 \
    || incus profile device add default awake disk source=/var/lib/chimera-awake path=/var/lib/chimera-awake readonly=true
- systemctl enable --now chimera-report.timer chimera-report-on-shutdown.service chimera-listen.service chimera-watch.service
- tailscale set --advertise-routes=10.171.245.0/24
- tailscale serve --bg --https=8443 http://127.0.0.1:7681
- systemctl try-reload-or-restart ssh
