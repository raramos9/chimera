#cloud-config

users:
  - name: andre
    uid: 1000
    shell: /bin/bash
    groups: [sudo, docker, incus-admin]
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    lock_passwd: true
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINrotfaJoO9CHVMrDKobM82hmNsCrrGsx/WfZg0kkPeV laptop
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIA59oRQ1l1QV0EVN2tCkxH2VY3Gqw0DdmQ9s1GGjG8gj phone

disable_root: true
ssh_pwauth: false
ssh_deletekeys: false

bootcmd:
  - |
    set -eu
    keys=/home/.chimera/ssh-host-keys

    blank() { rc=0; blkid -p "$1" >/dev/null || rc=$?; [ "$rc" -eq 2 ]; }

    for _ in $(seq 60); do
      set -- /dev/disk/by-id/scsi-0HC_Volume_*
      [ $# -eq 2 ] && break
      sleep 1
    done
    [ $# -eq 2 ] || { echo "chimera: expected two volumes (chimera-home, chimera-machines), found $*" >&2; exit 1; }

    home=$(blkid -L chimera-home || true)
    if [ -z "$home" ]; then
      for d; do blank "$d" || continue; [ -z "$home" ] || { echo "chimera: both volumes are blank, can't tell which is /home" >&2; exit 1; }; home=$d; done
      [ -n "$home" ] || { echo "chimera: no volume is labelled chimera-home and none is blank" >&2; exit 1; }
      mkfs.ext4 -L chimera-home "$home"
    fi
    for d; do [ "$(readlink -f "$d")" = "$(readlink -f "$home")" ] || machines=$d; done
    install -d /run/chimera && echo "$machines" > /run/chimera/machines-disk

    mountpoint -q /home || mount "$home" /home
    resize2fs "$home" || echo "chimera: couldn't grow /home to the volume size" >&2

    rm -f /etc/ssh/ssh_host_*
    if [ -d "$keys" ]; then cp -p "$keys"/ssh_host_* /etc/ssh/; fi

    install -d -m 700 /home/.chimera/tailscale /var/lib/tailscale
    mountpoint -q /var/lib/tailscale || mount --bind /home/.chimera/tailscale /var/lib/tailscale

    install -d -m 710 /home/.chimera/docker /var/lib/docker
    mountpoint -q /var/lib/docker || mount --bind /home/.chimera/docker /var/lib/docker
    install -d -m 711 /home/.chimera/containerd /var/lib/containerd
    mountpoint -q /var/lib/containerd || mount --bind /home/.chimera/containerd /var/lib/containerd
    install -d -m 711 /home/.chimera/incus /var/lib/incus
    mountpoint -q /var/lib/incus || mount --bind /home/.chimera/incus /var/lib/incus

write_files:
  # Docker otherwise sets the kernel's forwarding policy to drop, which cuts Incus containers off the internet.
  - path: /etc/docker/daemon.json
    content: |
      {"ip-forward-no-drop": true}
  - path: /etc/systemd/system/incus.service.d/chimera.conf
    content: |
      [Unit]
      RequiresMountsFor=/var/lib/incus
  - path: /usr/local/bin/chimera-idle-check
    permissions: "0755"
    content: |
      #!/bin/sh
      set -eu
      dir=/run/chimera-idle
      mkdir -p "$dir"
      minutes=30
      if [ -e "$dir/minutes" ]; then minutes=$(cat "$dir/minutes"); fi
      busy() {
        [ -e /home/andre/.keep-awake ] \
          || pgrep -f '^sshd(-session)?: [^ ]+@' >/dev/null \
          || ! flock -n -x "$dir/awake.lock" true
      }
      if [ ! -e "$dir/last-busy" ] || busy; then
        touch "$dir/last-busy"
        exit 0
      fi
      if [ $(( $(date +%s) - $(stat -c %Y "$dir/last-busy") )) -ge $(( minutes * 60 )) ]; then
        echo "chimera: idle for $minutes minutes, powering off"
        systemctl poweroff
      fi
  - path: /usr/local/bin/awake
    permissions: "0755"
    content: |
      #!/bin/sh
      exec flock -o -s /run/chimera-idle/awake.lock "$@"
  - path: /usr/local/bin/chimera-agent-busy
    permissions: "0755"
    content: |
      #!/bin/sh
      pid=$PPID
      while [ -n "$pid" ] && [ "$pid" -gt 1 ]; do
        [ "$(ps -o comm= -p "$pid" 2>/dev/null)" = claude ] && break
        pid=$(ps -o ppid= -p "$pid" 2>/dev/null | tr -d ' ')
      done
      [ -n "$pid" ] && [ "$pid" -gt 1 ] || exit 0
      busy=$(python3 -c '
      import json, sys
      d = json.load(sys.stdin)
      event = d.get("hook_event_name")
      tasks = d.get("background_tasks") or []
      running = any(t.get("status") == "running" for t in tasks)
      print(int(event == "UserPromptSubmit" or (event == "Stop" and running) or bool(d.get("session_crons"))))
      ' 2>/dev/null) || exit 0
      holder="tail --pid=$pid -f /dev/null"
      if [ "$busy" = 1 ]; then
        pgrep -f "$holder" >/dev/null \
          || setsid -f flock -o -s /run/chimera-idle/awake.lock tail --pid="$pid" -f /dev/null </dev/null >/dev/null 2>&1
      else
        pkill -f "$holder" || true
      fi
      exit 0
  - path: /etc/claude-code/managed-settings.json
    content: |
      {"hooks": {
        "UserPromptSubmit": [{"hooks": [{"type": "command", "command": "/usr/local/bin/chimera-agent-busy"}]}],
        "Stop": [{"hooks": [{"type": "command", "command": "/usr/local/bin/chimera-agent-busy"}]}]
      }}
  - path: /etc/profile.d/chimera-tmux.sh
    content: |
      if [ -n "${SSH_CONNECTION:-}" ] && [ -z "${TMUX:-}" ] && [ -t 0 ] && command -v tmux >/dev/null; then
        tmux new-session -A -s main && exit
      fi
  - path: /usr/local/bin/chimera-restic
    permissions: "0755"
    content: |
      #!/bin/sh
      set -eu
      dir=/home/.chimera/backup
      set -a; . "$dir/env"; set +a
      export RESTIC_PASSWORD_FILE="$dir/password" RESTIC_CACHE_DIR="$dir/cache"
      exec restic "$@"
  - path: /usr/local/bin/chimera-backup
    permissions: "0755"
    content: |
      #!/bin/sh
      set -eu
      if [ ! -e /home/.chimera/backup/env ]; then
        echo "chimera: no backup keys on the volume, skipping backup"
        exit 0
      fi
      exec flock /run/chimera-backup.lock /usr/local/bin/chimera-restic backup /home --host chimera --one-file-system \
        --exclude /home/.chimera/backup \
        --exclude /home/.chimera/incus/images \
        --exclude /home/.chimera/containerd \
        --exclude '/home/.chimera/docker/*' \
        --exclude '!/home/.chimera/docker/volumes' \
        --exclude '/home/*/.cache' \
        --exclude node_modules
  - path: /etc/systemd/system/chimera-backup.service
    content: |
      [Unit]
      Description=Back up /home to R2

      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/chimera-backup
  - path: /etc/systemd/system/chimera-backup.timer
    content: |
      [Timer]
      OnBootSec=1h
      OnUnitActiveSec=1h

      [Install]
      WantedBy=timers.target
  - path: /etc/systemd/system/chimera-backup-on-shutdown.service
    content: |
      [Unit]
      Description=Back up /home to R2 before shutting down
      Wants=network-online.target
      After=network-online.target systemd-networkd.service systemd-resolved.service
      RequiresMountsFor=/home

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/bin/true
      ExecStop=/usr/local/bin/chimera-backup
      TimeoutStopSec=10min

      [Install]
      WantedBy=multi-user.target
  - path: /etc/systemd/system/chimera-idle.service
    content: |
      [Unit]
      Description=Power off when nobody has been connected for a while

      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/chimera-idle-check
  - path: /etc/systemd/system/chimera-idle.timer
    content: |
      [Timer]
      OnBootSec=1min
      OnUnitActiveSec=1min
      AccuracySec=10s

      [Install]
      WantedBy=timers.target
  - path: /etc/systemd/logind.conf.d/60-chimera.conf
    content: |
      [Login]
      PowerKeyIgnoreInhibited=yes
  - path: /etc/ssh/sshd_config.d/60-chimera.conf
    content: |
      ClientAliveInterval 60
      ClientAliveCountMax 3

runcmd:
  - |
    keys=/home/.chimera/ssh-host-keys
    if [ ! -d "$keys" ]; then
      install -d -m 700 "$keys"
      cp -p /etc/ssh/ssh_host_* "$keys"/
    fi
  - install -d /run/chimera-idle && touch /run/chimera-idle/awake.lock
  - systemctl daemon-reload
  - systemctl reload systemd-logind
  - systemctl enable --now chimera-idle.timer chimera-backup.timer chimera-backup-on-shutdown.service
  - systemctl start incus.socket incus-user.socket incus-startup.service
  - |
    incus admin waitready --timeout 60
    if ! incus storage show default >/dev/null 2>&1; then
      disk=$(cat /run/chimera/machines-disk)
      rc=0; blkid -p "$disk" >/dev/null || rc=$?
      if [ "$rc" -eq 2 ]; then
        incus admin init --preseed <<EOF
    storage_pools:
    - name: default
      driver: btrfs
      config:
        source: $disk
    networks:
    - name: incusbr0
      type: bridge
      config:
        ipv4.address: auto
        ipv6.address: none
    profiles:
    - name: default
      devices:
        root: {path: /, pool: default, type: disk}
        eth0: {name: eth0, network: incusbr0, type: nic}
    EOF
      else
        echo "chimera: Incus has no storage but $disk isn't blank, leaving it alone (see 'incus admin recover')" >&2
      fi
    fi
  - systemctl try-reload-or-restart ssh
