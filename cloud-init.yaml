    [Install]
    WantedBy=multi-user.target
- path: /usr/local/bin/chimera-listen
  permissions: "0755"
  content: |
    #!/usr/bin/python3
    import asyncio, subprocess, websockets

    def start_round():
        subprocess.run(["systemctl", "start", "--no-block", "chimera-report.service"])

    async def listen():
        with open("/home/.chimera/agent-token") as f:
            headers = {"Authorization": "Bearer " + f.read().strip()}
        url = "wss://chimera-control.ralphandrer04.workers.dev/agent"
        async with websockets.connect(url, extra_headers=headers, ping_interval=None) as ws:
            start_round()
            while True:
                try:
                    message = await asyncio.wait_for(ws.recv(), 30)
                except asyncio.TimeoutError:
                    await ws.send("ping")
                    message = await asyncio.wait_for(ws.recv(), 20)
                if message == "orders":
                    start_round()

    asyncio.run(listen())
- path: /etc/systemd/system/chimera-listen.service
  content: |
    [Unit]
    Description=Run a round as soon as the Worker says orders changed
    Wants=network-online.target
    After=network-online.target
    ConditionPathExists=/home/.chimera/agent-token

    [Service]
    ExecStart=/usr/local/bin/chimera-listen
    Restart=always
    RestartSec=5

    [Install]
    WantedBy=multi-user.target
- path: /usr/local/bin/chimera-watch
  permissions: "0755"
  content: |
    #!/bin/bash
    name=${1-}
    if ! [[ $name =~ ^[a-z][a-z0-9-]{0,62}$ && $name != base ]] || ! incus list -c n -f csv | grep -qx "$name"; then
      echo "No such container: $name"; sleep 5; exit 1
    fi
    flags=()
    [[ ${2-} == view ]] && flags=(-f read-only,ignore-size)
    incus exec "$name" -- sudo -iu andre tmux attach "${flags[@]}" -t main:claude || { echo "Claude isn't running in $name."; sleep 5; }
- path: /etc/systemd/system/chimera-watch.service
  content: |
    [Unit]
    Description=Watch Claude in a container from a browser, through tailscale serve on port 8443
    ConditionPathExists=/usr/bin/ttyd
    After=incus.service

    [Service]
    User=andre
    ExecStart=/usr/bin/ttyd -i lo -p 7681 --writable --url-arg --check-origin -t disableResizeOverlay=true -t 'theme={"background":"#09090b","foreground":"#d4d4d8","cursor":"#d4d4d8"}' /usr/local/bin/chimera-watch
    Restart=always
    RestartSec=5

    [Install]
    WantedBy=multi-user.target
- path: /usr/local/bin/chimera-idle-check
  permissions: "0755"
  content: |
    #!/bin/sh
    set -eu
    dir=/run/chimera-idle
    mkdir -p "$dir"
    minutes=30
    if [ -e "$dir/minutes" ]; then minutes=$(cat "$dir/minutes"); fi
    busy() {
      [ -e /home/andre/.keep-awake ] \
        || pgrep -f '^sshd(-session)?: [^ ]+@' >/dev/null \
        || ! flock -n -x /var/lib/chimera-awake/awake.lock true
    }
    if [ ! -e "$dir/last-busy" ] || busy; then
      touch "$dir/last-busy"
      exit 0
    fi
    if [ $(( $(date +%s) - $(stat -c %Y "$dir/last-busy") )) -ge $(( minutes * 60 )) ]; then
      echo "chimera: idle for $minutes minutes, powering off"
      systemctl poweroff
    fi
- path: /usr/local/bin/awake
  permissions: "0755"
  content: |
    #!/bin/sh
    exec flock -o -s /var/lib/chimera-awake/awake.lock "$@"
- path: /usr/local/bin/chimera-agent-busy
  permissions: "0755"
  content: |
    #!/bin/sh
    pid=$PPID
    while [ -n "$pid" ] && [ "$pid" -gt 1 ]; do
      [ "$(ps -o comm= -p "$pid" 2>/dev/null)" = claude ] && break
      pid=$(ps -o ppid= -p "$pid" 2>/dev/null | tr -d ' ')
    done
    [ -n "$pid" ] && [ "$pid" -gt 1 ] || exit 0
    busy=$(python3 -c '
    import json, sys
    d = json.load(sys.stdin)
    event = d.get("hook_event_name")
    tasks = d.get("background_tasks") or []
    running = any(t.get("status") == "running" for t in tasks)
    print(int(event == "UserPromptSubmit" or (event == "Stop" and running) or bool(d.get("session_crons"))))
    ' 2>/dev/null) || exit 0
    if [ -d "$HOME/.config/chimera" ]; then
      if [ "$busy" = 1 ]; then echo working; else echo waiting; fi > "$HOME/.config/chimera/agent"
    fi
    holder="tail --pid=$pid -f /dev/null"
    if [ "$busy" = 1 ]; then
      pgrep -f "$holder" >/dev/null \
        || setsid -f flock -o -s /var/lib/chimera-awake/awake.lock tail --pid="$pid" -f /dev/null </dev/null >/dev/null 2>&1
    else
      pkill -f "$holder" || true
    fi
    exit 0
- path: /etc/claude-code/managed-settings.json
  content: |
    {"hooks": {
      "UserPromptSubmit": [{"hooks": [{"type": "command", "command": "/usr/local/bin/chimera-agent-busy"}]}],
      "Stop": [{"hooks": [{"type": "command", "command": "/usr/local/bin/chimera-agent-busy"}]}]
    }}
